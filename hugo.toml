baseURL = 'https://babonneau.netlify.app/'
locale = 'en-us'
title = 'St. Lucia blog 2026'
theme = 'PaperMod'

[params]
  [params.homeInfoParams]
    Title = "Welcome to Babonneau"
    Content = "Here you'll find a lot of cool information about a lot of cool stuff."

  [[params.socialIcons]]
    name = "facebook"
    url = "https://facebook.com/"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://twitter.com/"
    
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com"
    
  ShowBreadCrumbs = true
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  [params.cover]
    linkFullImages = true

[menu]
  [[menu.main]]
    identifier = 'Categories'
    name = 'Categories'
    url = '/categories/'
    weight = 10

  [[menu.main]]
    identifier = 'Tags'
    name = 'Tags'
    url = '/tags/'
    weight = 20

  [[menu.main]]
    identifier = 'Archives'
    name = 'Archives'
    url = '/archives/'
    weight = 30